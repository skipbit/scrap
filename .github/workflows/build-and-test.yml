# Reusable workflow for cross-platform build and test.
#
# Called by pr-checks.yml, main-checks.yml, and release.yml.
# Not intended for standalone execution (workflow_call only).
#
# Each job names the compiler and standard library it builds with, covering
# the range the README supports: GCC 13 and 15 with their own libstdc++, Clang
# 20 and 22 with libstdc++ 13, 14 and the runner's default, and with libc++,
# and the Apple Clang of macOS 15 and 26. Toolchains come only from the runner
# images and the distribution's own repositories.
#
# The matrix runs Release only. Debug builds are handled separately by
# coverage jobs in pr-checks.yml and main-checks.yml.
#
# The build type comes from CMakePresets.json. The toolchain goes through the
# environment so that the presets stay free of CMAKE_CXX_FLAGS: CMake ignores
# CXXFLAGS once the cache sets it.

name: Build and Test

on:
  workflow_call:
    inputs:
      build-system:
        description: 'Build system to use (currently: cmake only)'
        type: string
        required: false
        default: 'cmake'
      ref:
        description: 'Git ref to checkout (empty = caller default)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.toolchain.name }}
    # Note: build-type filtering removed - matrix context is not available
    # in job-level if conditions. Current matrix is Release-only; callers
    # needing Debug use a preset of their own (e.g. coverage jobs).
    strategy:
      fail-fast: false
      matrix:
        preset: [release]
        toolchain:
          # GCC 13 is on ubuntu-24.04, everything else on Linux on ubuntu-26.04.
          #
          # stdlib is the macro the standard library defines about itself,
          # with the release where a job pins one.
          - { name: gcc-13, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, stdlib: '_GLIBCXX_RELEASE 13' }
          - { name: gcc-15, os: ubuntu-26.04, cc: gcc-15, cxx: g++-15, stdlib: '_GLIBCXX_RELEASE 15' }
          # The runner's default libstdc++, which most Clang users on Linux
          # build against. Its release is reported, not asserted on: a change
          # of image is news, not a failure.
          - { name: clang-20, os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: _GLIBCXX_RELEASE }
          - { name: clang-22, os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: _GLIBCXX_RELEASE }
          # The rest of the libstdc++ range. Which release Clang uses does not
          # follow from its version, so each one is pinned.
          - { name: clang-20-libstdc++-13, os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: '_GLIBCXX_RELEASE 13', packages: libstdc++-13-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13' }
          - { name: clang-20-libstdc++-14, os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: '_GLIBCXX_RELEASE 14', packages: libstdc++-14-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14' }
          - { name: clang-22-libstdc++-13, os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: '_GLIBCXX_RELEASE 13', packages: libstdc++-13-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13' }
          - { name: clang-22-libstdc++-14, os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: '_GLIBCXX_RELEASE 14', packages: libstdc++-14-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14' }
          # libc++ at both ends of the Clang range. The two releases conflict
          # as packages, so each job installs its own.
          - { name: clang-20-libc++, os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: _LIBCPP_VERSION, packages: 'libc++-20-dev libc++abi-20-dev', flags: '-stdlib=libc++' }
          - { name: clang-22-libc++, os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: _LIBCPP_VERSION, packages: 'libc++-22-dev libc++abi-22-dev', flags: '-stdlib=libc++' }
          # The Apple Clang that ships with each OS release, against the libc++
          # that comes with it.
          - { name: macos-15, os: macos-15, stdlib: _LIBCPP_VERSION }
          - { name: macos-26, os: macos-26, stdlib: _LIBCPP_VERSION }
    runs-on: ${{ matrix.toolchain.os }}
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      CXXFLAGS: ${{ matrix.toolchain.flags }}
      LDFLAGS: ${{ matrix.toolchain.flags }}
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The version is derived from git tags, which a shallow checkout
          # does not carry: without the history the build reports 0.0.0.
          fetch-depth: 0

      - name: Validate build system
        run: |
          case "${{ inputs.build-system }}" in
            cmake) ;;
            *)
              echo "::error::Unsupported build system: '${{ inputs.build-system }}'"
              exit 1
              ;;
          esac

      - name: Install packages
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            read -r -a packages <<< "ccache ${{ matrix.toolchain.packages }}"
            sudo apt-get install -y -qq "${packages[@]}"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if ! command -v ccache &>/dev/null; then
              brew install ccache
            fi
          fi

      # The cache lives where actions/cache saves and restores it. A tilde in
      # env: is not expanded: ccache would read it as a directory named '~'
      # under wherever it runs, and nothing would be saved.
      - name: Set the ccache directory
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.toolchain.os }}-${{ matrix.toolchain.name }}-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.toolchain.os }}-${{ matrix.toolchain.name }}-${{ matrix.preset }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Report toolchain versions
        run: |
          "${CXX:-c++}" --version
          if [ "$RUNNER_OS" = macOS ]; then xcrun --show-sdk-version; fi
          cmake --version

      # The preprocessor's own answer, rather than the include search path:
      # this is the release the build compiles against, with the flags the
      # build uses. A job that names a release fails unless it gets that one.
      - name: Check the standard library the compiler sees
        run: |
          read -r -a flags <<< "${CXXFLAGS:-}"
          macros=$(echo '#include <version>' | "${CXX:-c++}" -std=c++23 "${flags[@]}" -x c++ -dM -E -)
          seen=$(grep -E '^#define (_GLIBCXX_RELEASE|_LIBCPP_VERSION) ' <<< "$macros" | tr '\n' ' ')
          if ! grep -Eq '^#define ${{ matrix.toolchain.stdlib }}( |$)' <<< "$macros"; then
            echo "::error::expected ${{ matrix.toolchain.stdlib }}, the compiler defines $seen"
            exit 1
          fi
          echo "the compiler defines $seen"

      - name: Build and test (CMake)
        if: inputs.build-system == 'cmake'
        # macOS runners hit posix_spawn limits with unlimited parallelism;
        # use sequential build on macOS, full parallelism elsewhere. The test
        # preset fails on an empty test set (noTestsAction): the gtest
        # placeholder covers an unbuilt binary, this covers a tree that
        # registered nothing at all.
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          if [ "$RUNNER_OS" = "macOS" ]; then
            build_jobs=1
          else
            build_jobs=$jobs
          fi
          CMAKE_BUILD_PARALLEL_LEVEL=$build_jobs CTEST_PARALLEL_LEVEL=$jobs cmake --workflow --preset ${{ matrix.preset }}

      # The name says which compiler, and CMake's own record of the one it
      # chose is the evidence. The macOS jobs name an OS release and take the
      # compiler that comes with it, so they have nothing to compare.
      - name: Check the compiler the build used
        if: inputs.build-system == 'cmake' && matrix.toolchain.cxx
        run: |
          used=$(sed -n 's/^CMAKE_CXX_COMPILER:FILEPATH=//p' build/${{ matrix.preset }}/CMakeCache.txt)
          if [ "${used##*/}" != "$CXX" ]; then
            echo "::error::the build used $used, not $CXX"
            exit 1
          fi
          echo "the build used $used"

      # CMake ignores CXXFLAGS and LDFLAGS once the cache sets what they
      # initialise, and the build is green either way, so what the cache holds
      # is read back.
      - name: Check the flags reached the build
        if: inputs.build-system == 'cmake' && matrix.toolchain.flags
        run: |
          cache=build/${{ matrix.preset }}/CMakeCache.txt
          carries() {
            value=$(sed -n "s/^$1:STRING=//p" "$cache")
            if ! grep -qF -- "$2" <<< "$value"; then
              echo "::error::$1 is '$value', without '$2'"
              exit 1
            fi
            echo "$1 carries $2"
          }
          carries CMAKE_CXX_FLAGS "$CXXFLAGS"
          carries CMAKE_EXE_LINKER_FLAGS "$LDFLAGS"

      # What the build was configured with, as CMake recorded it.
      - name: Report the configuration the build used
        if: inputs.build-system == 'cmake'
        run: grep -E '^(CMAKE_CXX_COMPILER|CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS|BUILD_TESTS):' build/${{ matrix.preset }}/CMakeCache.txt

      - name: Print ccache statistics
        if: always()
        run: ccache --show-stats
