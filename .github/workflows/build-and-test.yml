# Reusable workflow for cross-platform build and test.
#
# Called by pr-checks.yml, main-checks.yml, and release.yml.
# Not intended for standalone execution (workflow_call only).
#
# Compiler versions follow the runner OS defaults:
#   Ubuntu 24.04: GCC 13, Clang 18
#   macOS 14: Apple Clang (Xcode default)
# Upgrading the runner OS automatically picks up newer compiler versions.
#
# Default matrix runs Release only (3 jobs). Debug builds are handled
# separately by coverage jobs in pr-checks.yml and main-checks.yml.

name: Build and Test

on:
  workflow_call:
    inputs:
      build-system:
        description: 'Build system to use (currently: cmake only)'
        type: string
        required: false
        default: 'cmake'
      ref:
        description: 'Git ref to checkout (empty = caller default)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }}
    # Note: build-type filtering removed — matrix context is not available
    # in job-level if conditions. Current matrix is Release-only; callers
    # needing Debug should build directly (e.g. coverage jobs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc, cc: gcc, cxx: g++, profile: Release, cxxflags: '' }
          - { os: ubuntu-24.04, compiler: clang, cc: clang, cxx: clang++, profile: Release, cxxflags: '-stdlib=libc++' }
          - { os: macos-14, compiler: apple-clang, cc: clang, cxx: clang++, profile: Release, cxxflags: '' }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ~/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Validate build system
        run: |
          case "${{ inputs.build-system }}" in
            cmake) ;;
            *)
              echo "::error::Unsupported build system: '${{ inputs.build-system }}'"
              exit 1
              ;;
          esac

      - name: Install packages
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            packages=(ccache)
            if [ "${{ matrix.cxxflags }}" = "-stdlib=libc++" ]; then
              packages+=(libc++-dev libc++abi-dev)
            fi
            sudo apt-get install -y -qq "${packages[@]}"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if ! command -v ccache &>/dev/null; then
              brew install ccache
            fi
          fi

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.profile }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.profile }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Configure (CMake)
        if: inputs.build-system == 'cmake'
        run: |
          cmake_flags=(-B build
            -DCMAKE_BUILD_TYPE=${{ matrix.profile }}
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DBUILD_TESTS=ON)
          if [ -n "${{ matrix.cxxflags }}" ]; then
            cmake_flags+=(-DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}")
          fi
          cmake "${cmake_flags[@]}"

      - name: Build (CMake)
        if: inputs.build-system == 'cmake'
        run: |
          # macOS runners hit posix_spawn limits with unlimited parallelism;
          # use sequential build on macOS, full parallelism elsewhere.
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake --build build --parallel 1
          else
            jobs=$(nproc 2>/dev/null || echo 4)
            cmake --build build --parallel "$jobs"
          fi

      - name: Test (CTest)
        if: inputs.build-system == 'cmake'
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Print ccache statistics
        if: always()
        run: ccache --show-stats
