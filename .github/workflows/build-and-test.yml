# Reusable workflow for cross-platform build and test.
#
# Called by pr-checks.yml, main-checks.yml, and release.yml.
# Not intended for standalone execution (workflow_call only).
#
# Compiler versions follow the runner OS defaults:
#   Ubuntu 24.04: GCC 13, Clang 18
#   macOS 14: Apple Clang (Xcode default)
# Upgrading the runner OS automatically picks up newer compiler versions.
#
# Default matrix runs Release only (3 jobs). Debug builds are handled
# separately by coverage jobs in pr-checks.yml and main-checks.yml.
#
# The build type comes from CMakePresets.json. The toolchain goes through the
# environment so that the presets stay free of CMAKE_CXX_FLAGS: CMake ignores
# CXXFLAGS once the cache sets it.

name: Build and Test

on:
  workflow_call:
    inputs:
      build-system:
        description: 'Build system to use (currently: cmake only)'
        type: string
        required: false
        default: 'cmake'
      ref:
        description: 'Git ref to checkout (empty = caller default)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }}
    # Note: build-type filtering removed - matrix context is not available
    # in job-level if conditions. Current matrix is Release-only; callers
    # needing Debug use a preset of their own (e.g. coverage jobs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc, cc: gcc, cxx: g++, preset: release, cxxflags: '' }
          - { os: ubuntu-24.04, compiler: clang, cc: clang, cxx: clang++, preset: release, cxxflags: '-stdlib=libc++' }
          - { os: macos-14, compiler: apple-clang, cc: clang, cxx: clang++, preset: release, cxxflags: '' }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxxflags }}
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ~/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The version is derived from git tags, which a shallow checkout
          # does not carry: without the history the build reports 0.0.0.
          fetch-depth: 0

      - name: Validate build system
        run: |
          case "${{ inputs.build-system }}" in
            cmake) ;;
            *)
              echo "::error::Unsupported build system: '${{ inputs.build-system }}'"
              exit 1
              ;;
          esac

      - name: Install packages
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            packages=(ccache)
            if [ "${{ matrix.cxxflags }}" = "-stdlib=libc++" ]; then
              packages+=(libc++-dev libc++abi-dev)
            fi
            sudo apt-get install -y -qq "${packages[@]}"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if ! command -v ccache &>/dev/null; then
              brew install ccache
            fi
          fi

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.preset }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Build and test (CMake)
        if: inputs.build-system == 'cmake'
        # macOS runners hit posix_spawn limits with unlimited parallelism;
        # use sequential build on macOS, full parallelism elsewhere. The test
        # preset fails on an empty test set (noTestsAction): the gtest
        # placeholder covers an unbuilt binary, this covers a tree that
        # registered nothing at all.
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          if [ "$RUNNER_OS" = "macOS" ]; then
            build_jobs=1
          else
            build_jobs=$jobs
          fi
          CMAKE_BUILD_PARALLEL_LEVEL=$build_jobs CTEST_PARALLEL_LEVEL=$jobs cmake --workflow --preset ${{ matrix.preset }}

      # What the build was configured with, as CMake recorded it.
      - name: Report the configuration the build used
        if: inputs.build-system == 'cmake'
        run: grep -E '^(CMAKE_CXX_COMPILER|CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS|BUILD_TESTS):' build/${{ matrix.preset }}/CMakeCache.txt

      - name: Print ccache statistics
        if: always()
        run: ccache --show-stats
