# Quality gate for pull requests.
#
# Runs build/test matrix, static analysis, format checks, and diff coverage.
# All checks must pass before a PR can be merged.

name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    with:
      build-system: 'cmake'

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libc++
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libc++-dev libc++abi-dev

      # The toolchain goes through the environment, as in build-and-test.yml.
      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -stdlib=libc++
        run: cmake --preset lint

      # What the build was configured with, as CMake recorded it.
      - name: Report the configuration the build used
        run: grep -E '^(CMAKE_CXX_COMPILER|CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS|BUILD_TESTS):' build/lint/CMakeCache.txt

      # Lint is scoped to the modules written against the strict check set.
      # Legacy modules predate it and are migrated or removed incrementally;
      # the scope widens as that migration progresses, and a module added here
      # is expected to stay clean from its first commit. Findings in any src/
      # header pulled in by these TUs (see HeaderFilterRegex) also fail the gate.
      - name: Run clang-tidy
        run: |
          find src/build src/command src/compile src/process src/project src/toolchain -type f -name '*.cpp' -print0 \
            | xargs -0 -r clang-tidy -p build/lint --warnings-as-errors='*'

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        run: |
          find src test -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

  diff-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install coverage tools
        run: pip install gcovr==8.5 diff-cover==10.0.0

      - name: Build and test with coverage
        # The test preset fails on an empty test set (noTestsAction): the
        # gtest placeholder covers an unbuilt binary, this covers a tree that
        # registered nothing at all.
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          CMAKE_BUILD_PARALLEL_LEVEL=$jobs CTEST_PARALLEL_LEVEL=$jobs cmake --workflow --preset coverage

      # What the build was configured with, as CMake recorded it.
      - name: Report the configuration the build used
        run: grep -E '^(CMAKE_CXX_COMPILER|CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS|BUILD_TESTS):' build/coverage/CMakeCache.txt

      - name: Generate coverage report
        run: |
          gcovr --cobertura coverage.xml \
            --root . \
            --exclude 'build/coverage/_deps/.*' \
            --exclude 'test/.*' \
            --gcov-ignore-errors=source_not_found \
            --gcov-ignore-errors=no_working_dir_found

      - name: Diff coverage report
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --markdown-report diff-coverage.md || true
          if [ -f diff-coverage.md ]; then
            cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Diff coverage report not generated" >> "$GITHUB_STEP_SUMMARY"
          fi
