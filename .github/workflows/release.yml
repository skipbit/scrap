# Publishes a GitHub release for a version tag.
#
# The tag is where the version comes from (see cmake/ProjectVersion.cmake), so
# a release is cut by pushing one. The build and the tests run again here
# because the version is baked in at build time and only exists once the tag
# does -- the matrix that ran on the branch built a different version of the
# same code. Static analysis and formatting are not repeated: they read the
# source, which the tag does not change, and the commit carries their result
# from the checks it passed on its way into main.
#
# Nothing is attached to the release. The build below exists to be asked for
# its version; GitHub's source archives are the artefacts.

name: Release

on:
  push:
    tags:
      # Deliberately broader than a release tag. A mistyped tag (v1.0, v2)
      # has to fail somewhere visible: narrowing this to the release shape
      # would start no run at all, and the only evidence of the mistake would
      # be a release that never appeared.
      - 'v[0-9]*'

permissions:
  contents: read

# Tags pushed together would otherwise race through the matrix and collide at
# the release step, the loser failing after a full run. They are not
# cancelled: each one is a release someone asked for.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Ahead of the matrix, so a tag that cannot produce a version costs one
  # build rather than three.
  check-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # By commit rather than by tag: a tag force-pushed while this runs
          # would otherwise move the ground under the later jobs, which each
          # resolve the ref again.
          ref: ${{ github.sha }}
          # The version is derived from git tags, which a shallow checkout
          # does not carry: without the history the build reports 0.0.0.
          fetch-depth: 0

      # Before the build, because this needs no compiler and a tag that
      # cannot produce a version should not spend one.
      #
      # The build has to describe itself by the tag being released. It will
      # not when the tag is outside the release pattern, when the history is
      # too shallow to carry it, or when the commit holds a second release
      # tag that git prefers -- and in that last case there is no answer to
      # give, so saying so beats publishing one of them at random.
      - name: Check the tag the build describes itself by
        run: |
          cmake -D "SOURCE_DIR=$PWD" -D "NAME=scrap" \
                -D "OUTPUT=$RUNNER_TEMP/version" -P cmake/PrintVersion.cmake
          described="$(sed -n 1p "$RUNNER_TEMP/version")"
          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the build describes itself as '$described', not $GITHUB_REF_NAME"
            exit 1
          fi
          echo "the build describes itself as $described"

      # GitHub attaches a source archive to each release. The archive is made
      # with the runner's git and checked with its own copy of the module.
      - name: Check a source archive describes itself the same way
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          git archive --format=tar --output="$RUNNER_TEMP/archive.tar" "$GITHUB_SHA"
          tar -xf "$RUNNER_TEMP/archive.tar" -C "$RUNNER_TEMP/archive"
          cmake -D "SOURCE_DIR=$RUNNER_TEMP/archive" -D "NAME=scrap" \
                -D "OUTPUT=$RUNNER_TEMP/archive-version" -P "$RUNNER_TEMP/archive/cmake/PrintVersion.cmake"
          described="$(sed -n 1p "$RUNNER_TEMP/archive-version")"
          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a source archive describes itself as '$described', not $GITHUB_REF_NAME"
            echo "Tags on this commit: $(git tag --points-at "$GITHUB_SHA" | tr '\n' ' ')"
            echo "git prefers an annotated tag; a malformed one such as v1.2.3.4 on this commit leaves the archive without a version."
            exit 1
          fi
          echo "a source archive describes itself as $described"

      # The matrix builds this configuration too; sharing its cache keeps the
      # second build from paying for the dependencies again.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-ubuntu-24.04-gcc-release-${{ github.run_id }}
          restore-keys: |
            ccache-ubuntu-24.04-gcc-release-

      # CCACHE_DIR is set here rather than in env:, which does not expand the
      # tilde, so the cache lands where actions/cache saved it.
      - name: Build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          cmake --preset release-no-tests
          cmake --build --preset release-no-tests -j"$(nproc)"

      # What the build was configured with, as CMake recorded it.
      - name: Report the configuration the build used
        run: grep -E '^(CMAKE_CXX_COMPILER|CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS|BUILD_TESTS):' build/release-no-tests/CMakeCache.txt

      # That the binary carries what the module computed. The expected text
      # comes from the module too, so nothing here re-derives the banner.
      - name: Check the binary against it
        run: |
          expected="$(sed -n 2p "$RUNNER_TEMP/version")"
          banner="$(./build/release-no-tests/bin/scrap version)"
          if [ "$banner" != "$expected" ]; then
            echo "::error::the binary reports '$banner', expected '$expected'"
            exit 1
          fi
          echo "the binary reports $banner"

  build-and-test:
    needs: check-version
    uses: ./.github/workflows/build-and-test.yml
    with:
      build-system: 'cmake'
      ref: ${{ github.sha }}

  release:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # creating the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Everything above was built from github.sha. If the tag has since been
      # moved, publishing it would ship a commit nothing here tested.
      - name: Check the tag still points at what was built
        run: |
          tagged="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME now points at $tagged, not the commit that was built ($GITHUB_SHA)"
            exit 1
          fi

      # An existing release is an error rather than a no-op: a tag that was
      # moved and re-pushed would otherwise pass every check above and leave
      # the stale release in place, reported as success. A lookup that fails
      # for any other reason is an error too -- treating it as "no release
      # exists" would disable the guard exactly when the API is unreliable.
      #
      # --verify-tag: without it gh creates the tag when it is missing, at the
      # default branch's head, publishing a release for a commit that was
      # never built here.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if lookup="$(gh release view "$GITHUB_REF_NAME" 2>&1)"; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; delete it before re-running"
            exit 1
          elif ! printf '%s' "$lookup" | grep -qi "release not found"; then
            echo "::error::could not determine whether $GITHUB_REF_NAME is released: $lookup"
            exit 1
          fi

          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
