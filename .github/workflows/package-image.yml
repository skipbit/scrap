# Builds the image the Linux job of package.yml runs in. On main, by a push
# or a manual start, it pushes the image to
# ghcr.io/skipbit/scrap/package-linux, tagged with the commit it was built
# from, and writes the digest the registry returned to the job summary. A
# pull request that changes the image builds it without pushing, so a
# Dockerfile that cannot be built does not reach main.
#
# package.yml names the image by digest, so a new image reaches the job only
# through a change that moves the digest, and a failed build here leaves the
# job on the image it has.

name: Package Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker/package-linux/**
      - .github/workflows/package-image.yml
  push:
    branches: [main]
    paths:
      - docker/package-linux/**
      - .github/workflows/package-image.yml

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}/package-linux
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build
        run: |
          docker buildx build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --load \
            docker/package-linux

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          case "$reference" in
            "${IMAGE}@sha256:"*) ;;
            *) echo "::error::no digest for the pushed image: $reference"; exit 1 ;;
          esac
          echo "$reference" | tee -a "$GITHUB_STEP_SUMMARY"
