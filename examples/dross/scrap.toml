# Builds dross as a static library and a program that uses it. The workflow
# examples.yml copies this file to the root of a dross checkout and main.cpp
# to check/main.cpp in it.

[package]
name = "dross"
version = "0.1.0"

[[lib]]
name = "dross"
# dross reads its internal headers as "thread/...".
include-dirs = ["src"]

# What CMake's Threads package gives a target that links dross. The workflow
# adds the job's standard library options to these two arrays.
[lib.public]
compile-flags = ["-pthread"]
link-flags = ["-pthread"]

[[bin]]
name = "check"
src = "check/main.cpp"
